# Alembic config for the TendTo API.
# The DB URL is NOT set here — env.py reads it from app.config.get_settings() so migrations
# and the app share one source of truth (DATABASE_URL / .env).

[alembic]
# %(here)s = the directory of this ini file, so `alembic -c <abs path>` works from any cwd.
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
