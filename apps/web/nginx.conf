# TendTo PWA — static SPA serving. TLS terminates at Dokploy's Traefik.
# OPFS (PowerSync's SQLite storage) requires a secure context — always serve over HTTPS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;

    # Hashed build assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the app shell or the service worker (PWA updates depend on this)
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # SPA fallback for TanStack Router paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
