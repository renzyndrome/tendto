# TendTo desktop — Phase A shell (stable Tauri 2.11). Phase B (native PowerSync via the alpha
# tauri-plugin-powersync) adds more deps — see docs/desktop.md; kept out here so Phase A builds clean.
[package]
name = "tendto-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tendto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins — gated so future mobile targets don't try to build them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
