[package]
name = "tendto-desktop"
version = "0.1.0"
description = "TendTo desktop shell"
edition = "2021"
# tauri-plugin-powersync's MSRV.
rust-version = "1.77.2"

[lib]
# `staticlib`/`cdylib` are what the mobile targets link against; `rlib` is what src/main.rs uses.
name = "tendto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.4"

# The PowerSync Tauri SDK is ALPHA and its IPC protocol is explicitly unstable, so both crates
# are pinned exactly. They must stay in step with the JS pins in apps/web/package.json
# (@powersync/tauri-plugin 0.0.6 → @powersync/common 2.0.0) — see
# .claude/memory/powersync-version-alignment.md. Bump them as a set, never one at a time.
tauri-plugin-powersync = "=0.0.6"
powersync = { version = "=0.0.7", features = ["tokio", "reqwest"] }

async-trait = "0.1"
base64 = "0.22"
log = "0.4"
# Must match the version the powersync crate builds against, or two TLS stacks get linked.
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
